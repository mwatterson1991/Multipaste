# Builds the app on one of GitHub's Macs whenever the app's code changes, checks that copies stack and
# paste in order, and publishes the zip as the "Latest build" download.
name: Build app

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Info.plist"
      - "Resources/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show tools
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Build and zip
        run: bash scripts/package.sh

      - name: Check that copies stack and paste in order
        run: bash scripts/check.sh

      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Multipaste.zip \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
